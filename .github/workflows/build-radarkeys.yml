name: Build RadarKeys.dll

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest   # only Windows runners have MSVC/MSBuild available

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find best available PlatformToolset
        id: toolset
        shell: pwsh
        run: |
          function Find-VsTool($name) {
            foreach ($base in @("${env:ProgramFiles(x86)}", "${env:ProgramFiles}")) {
              $candidate = Join-Path $base "Microsoft Visual Studio\Installer\$name"
              if (Test-Path $candidate) { return $candidate }
            }
            throw "$name not found under either Program Files location"
          }
          $vswhere = Find-VsTool "vswhere.exe"
          $installPath = & $vswhere -latest -products * -property installationPath
          Write-Host "VS install path: $installPath"

          $msvcRoot = Join-Path $installPath "VC\Tools\MSVC"
          if (Test-Path $msvcRoot) {
            Write-Host "MSVC toolset versions found under VC\Tools\MSVC:"
            Get-ChildItem $msvcRoot -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
          }

          $auxBuild = Join-Path $installPath "VC\Auxiliary\Build"
          $markers = Get-ChildItem $auxBuild -Filter "Microsoft.VCToolsVersion.v*.default.txt" -ErrorAction SilentlyContinue
          if ($markers.Count -eq 0) {
            throw "No Microsoft.VCToolsVersion.v*.default.txt marker files found under $auxBuild - can't determine PlatformToolset label"
          }
          $labels = $markers | ForEach-Object {
            if ($_.Name -match '^Microsoft\.VCToolsVersion\.(v\d+)\.default\.txt$') { $Matches[1] }
          } | Sort-Object -Descending
          Write-Host "PlatformToolset labels available: $($labels -join ', ')"
          $best = $labels[0]
          Write-Host "Using: $best"
          echo "toolset=$best" >> $env:GITHUB_OUTPUT

      - name: Find installed Windows 10 SDK version
        id: sdk
        shell: pwsh
        run: |
          $sdkVersions = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory |
            Where-Object { $_.Name -match '^10\.' } |
            Sort-Object Name -Descending
          if ($sdkVersions.Count -eq 0) {
            Write-Error "No Windows 10 SDK found under Windows Kits\10\Include"
            exit 1
          }
          $latest = $sdkVersions[0].Name
          Write-Host "Installed SDK versions found:"
          $sdkVersions | ForEach-Object { Write-Host "  $($_.Name)" }
          Write-Host "Using: $latest"
          echo "version=$latest" >> $env:GITHUB_OUTPUT

      - name: Build Release|x64
        run: msbuild RadarKeys.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=${{ steps.sdk.outputs.version }} /p:PlatformToolset=${{ steps.toolset.outputs.toolset }} /m

      - name: Upload RadarKeys build
        uses: actions/upload-artifact@v4
        with:
          name: RadarKeys-build
          path: makebite/GameDir
          if-no-files-found: error
